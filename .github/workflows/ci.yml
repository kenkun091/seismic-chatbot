name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (Python 3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest   # test-only dependency, not in requirements.txt

      # Run only the maintained pytest suite under tests/. The loose root-level
      # test_*.py are standalone scripts (one reads stdin) and are not collected here.
      # No test instantiates the RAG vector store, so this runs offline.
      - name: Run tests
        run: python -m pytest tests/ -q
